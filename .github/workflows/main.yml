name: CI/CD

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies and build
        run: |
          cd frontend
          npm install
          npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Check Formatting
        if: ${{ matrix.use_cross == false }}
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Clippy
        if: ${{ matrix.use_cross == false }}
        run: cargo clippy --manifest-path backend/Cargo.toml --target ${{ matrix.target }} -- -D warnings

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --manifest-path backend/Cargo.toml --release --target ${{ matrix.target }}
          else
            cargo build --manifest-path backend/Cargo.toml --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}-${{ matrix.os }}
          path: |
            backend/target/${{ matrix.target }}/release/reminders-backend
            backend/target/${{ matrix.target }}/release/reminders-backend.exe

  build-and-push-image:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public

      - name: Download backend amd64
        uses: actions/download-artifact@v4
        with:
          name: backend-amd64-ubuntu-latest
          path: artifacts/backend-amd64

      - name: Download backend arm64
        uses: actions/download-artifact@v4
        with:
          name: backend-arm64-ubuntu-latest
          path: artifacts/backend-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
